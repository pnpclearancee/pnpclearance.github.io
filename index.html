<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Verification</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: #ffffff;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;
        }

        .photo-container {
            width: 100%;
            height: 100vh;
            height: 100dvh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 0;
        }

        .photo {
            display: block;

            width: auto;
            height: auto;

            max-width: 100%;
            max-height: 100%;

            object-fit: contain;

            image-rendering: auto;

            -webkit-user-drag: none;
            user-select: none;
        }
    </style>
</head>

<body>

    <div class="photo-container">
        <img
            class="photo"
            src="photo.jpg"
            alt=""
        >
    </div>

</body>
</html>
